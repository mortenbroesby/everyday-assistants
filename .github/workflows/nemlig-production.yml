name: Nemlig production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit:
        description: Full green main ancestor SHA to deploy for recovery
        required: true
        type: string
      recovery:
        description: Confirm this is an incident recovery deployment
        required: true
        type: boolean
      resume_retention:
        description: Resume interrupted image cleanup without deploying
        required: false
        type: boolean
        default: false
      resume_worker_retention:
        description: Resume an interrupted Worker-version cleanup without deploying
        required: false
        type: boolean
        default: false
      reconcile_operation:
        description: Reconcile one saved pending rollback operation and release its lease
        required: false
        type: string

concurrency:
  group: nemlig-production
  cancel-in-progress: false
  queue: max

permissions:
  # The protected deploy/finalize jobs create and delete the bounded recovery
  # ref. Jobs that do not need that capability keep their narrower permissions.
  contents: write

env:
  CANDIDATE_SHA: "${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.commit) || github.sha }}"
  RECOVERY: "${{ github.event_name == 'workflow_dispatch' && inputs.recovery || false }}"
  RESUME_RETENTION: "${{ github.event_name == 'workflow_dispatch' && inputs.resume_retention || false }}"
  RESUME_WORKER_RETENTION: "${{ github.event_name == 'workflow_dispatch' && inputs.resume_worker_retention || false }}"
  RECONCILE_OPERATION: "${{ github.event_name == 'workflow_dispatch' && inputs.reconcile_operation || '' }}"

jobs:
  release-gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.recovery == true || inputs.resume_retention == true || inputs.resume_worker_retention == true || inputs.reconcile_operation != '')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: "${{ steps.approval.outputs.deploy }}"
      retention: "${{ steps.approval.outputs.retention || 'false' }}"
      retention_commit: "${{ steps.approval.outputs.retention_commit }}"
      worker_retention: "${{ steps.approval.outputs.worker_retention || 'false' }}"
      reconcile: "${{ steps.approval.outputs.reconcile || 'false' }}"
    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ env.CANDIDATE_SHA }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Check main candidate ancestry
        id: approval
        env:
          CANDIDATE_SHA: "${{ env.CANDIDATE_SHA }}"
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$RECOVERY" == "true" && "$RESUME_RETENTION" == "true" ]]; then
            echo "Recovery deployment and retention resume are mutually exclusive." >&2
            exit 1
          fi
          if [[ "$RECOVERY" == "true" && "$RESUME_WORKER_RETENTION" == "true" ]] || [[ "$RESUME_RETENTION" == "true" && "$RESUME_WORKER_RETENTION" == "true" ]]; then
            echo "Only one recovery or retention-resume mode may be selected." >&2
            exit 1
          fi
          if [[ -n "$RECONCILE_OPERATION" && "$RECOVERY" != "true" ]]; then
            echo "Rollback reconciliation requires explicit recovery=true." >&2
            exit 1
          fi
          if [[ -n "$RECONCILE_OPERATION" && "$RESUME_RETENTION" == "true" ]]; then
            echo "Rollback reconciliation and retention resume are mutually exclusive." >&2
            exit 1
          fi
          if [[ -n "$RECONCILE_OPERATION" && "$RESUME_WORKER_RETENTION" == "true" ]]; then
            echo "Rollback reconciliation and Worker-version retention resume are mutually exclusive." >&2
            exit 1
          fi
          if [[ -n "$RECONCILE_OPERATION" && ! "$RECONCILE_OPERATION" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]; then
            echo "Rollback reconciliation requires a valid operation UUID." >&2
            exit 1
          fi
          git fetch origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main; then
            echo "Candidate must remain in current main history." >&2
            exit 1
          fi
          if [[ "$RESUME_RETENTION" == "true" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "retention=true" >> "$GITHUB_OUTPUT"
            echo "retention_commit=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
            echo "worker_retention=false" >> "$GITHUB_OUTPUT"
            echo "reconcile=false" >> "$GITHUB_OUTPUT"
          elif [[ "$RESUME_WORKER_RETENTION" == "true" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "retention=false" >> "$GITHUB_OUTPUT"
            echo "worker_retention=true" >> "$GITHUB_OUTPUT"
            echo "reconcile=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RECONCILE_OPERATION" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "retention=false" >> "$GITHUB_OUTPUT"
            echo "worker_retention=false" >> "$GITHUB_OUTPUT"
            echo "reconcile=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "retention=false" >> "$GITHUB_OUTPUT"
            echo "worker_retention=false" >> "$GITHUB_OUTPUT"
            echo "reconcile=false" >> "$GITHUB_OUTPUT"
          fi

  retention:
    needs: [release-gate, preflight, deploy]
    if: >-
      always() &&
      (needs.release-gate.outputs.deploy == 'true' || needs.release-gate.outputs.retention == 'true' || needs.release-gate.outputs.worker_retention == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: nemlig-production
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout accepted main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ env.CANDIDATE_SHA }}"
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Install frozen dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Download accepted deployment evidence
        if: ${{ always() && needs.deploy.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: nemlig-production-release
          path: ${{ runner.temp }}/nemlig-production-release
      - name: Retain accepted production images
        id: retention_summary
        if: ${{ always() && steps.install.outcome == 'success' }}
        env:
          GH_TOKEN: "${{ github.token }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          DEPLOY_RESULT: "${{ needs.deploy.result }}"
          CANDIDATE_SHA: "${{ env.CANDIDATE_SHA }}"
          NEMLIG_CONTAINER_IMAGE_RETENTION_COUNT: "${{ vars.NEMLIG_CONTAINER_IMAGE_RETENTION_COUNT || '10' }}"
        run: |
          set -euo pipefail
          retention_report="$RUNNER_TEMP/nemlig-retention.json"
          retention_status=0
          if [[ "$DEPLOY_RESULT" == "success" ]]; then
            mapfile -t journals < <(find "$RUNNER_TEMP/nemlig-production-release" -type f -name latest.json -print)
            if [[ "${#journals[@]}" -ne 1 ]]; then
              printf '{"commit":"%s","outcome":"failed","failure":"acceptance_evidence_missing"}\n' "$CANDIDATE_SHA" > "$retention_report"
              retention_status=1
            else
              pnpm --silent --filter nemlig-assistant production:retention -- accept "$CANDIDATE_SHA" "${journals[0]}" > "$retention_report" || retention_status=$?
            fi
          elif [[ "${{ needs.release-gate.outputs.retention }}" == "true" ]]; then
            pnpm --silent --filter nemlig-assistant production:retention -- resume "${{ needs.release-gate.outputs.retention_commit }}" > "$retention_report" || retention_status=$?
          elif [[ "${{ needs.release-gate.outputs.worker_retention }}" == "true" ]]; then
            printf '{"commit":"%s","outcome":"skipped","failure":"worker_retention_resume"}\n' "$CANDIDATE_SHA" > "$retention_report"
          else
            echo "Retention job was scheduled without accepted deployment or explicit image-retention resume." >&2
            printf '{"commit":"%s","outcome":"failed","failure":"deployment_not_accepted"}\n' "$CANDIDATE_SHA" > "$retention_report"
            retention_status=1
          fi
          release_journal=""
          if [[ -d "$RUNNER_TEMP/nemlig-production-release" ]]; then
            mapfile -t release_journals < <(find "$RUNNER_TEMP/nemlig-production-release" -type f -name latest.json -print)
            if [[ "${#release_journals[@]}" -eq 1 ]]; then release_journal="${release_journals[0]}"; fi
          fi
          summary_args=(--commit "$CANDIDATE_SHA" --retention "$retention_report")
          if [[ -n "$release_journal" ]]; then summary_args+=(--release "$release_journal"); fi
          pnpm --silent --filter nemlig-assistant exec tsx scripts/production-summary.ts -- "${summary_args[@]}" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$retention_status"
      - name: Retain old Worker versions
        id: worker_version_retention
        if: ${{ always() && ((needs.deploy.result == 'success' && steps.retention_summary.outcome == 'success') || needs.release-gate.outputs.worker_retention == 'true') }}
        env:
          GH_TOKEN: "${{ github.token }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          NEMLIG_WORKER_VERSION_RECOVERY_IDS: "${{ vars.NEMLIG_WORKER_VERSION_RECOVERY_IDS }}"
          NEMLIG_WORKER_VERSION_RECOVERY_REVIEWED: "${{ vars.NEMLIG_WORKER_VERSION_RECOVERY_REVIEWED }}"
        run: |
          set -euo pipefail
          worker_commit="$CANDIDATE_SHA"
          if [[ "${{ needs.release-gate.outputs.worker_retention }}" == "true" ]]; then
            lock_content=$(gh api "repos/${GITHUB_REPOSITORY}/contents/worker-version-retention.json?ref=codex-lock%2Fnemlig-production" --jq '.content' 2>/dev/null || true)
            if [[ -n "$lock_content" ]]; then
              durable_report=$(printf '%s' "$lock_content" | base64 -d 2>/dev/null || true)
              retention_run_id=$(printf '%s' "$durable_report" | jq -r '.runId // empty' 2>/dev/null || true)
              durable_commit=$(printf '%s' "$durable_report" | jq -r '.commit // empty' 2>/dev/null || true)
              if [[ "$durable_commit" =~ ^[0-9a-f]{40}$ ]]; then worker_commit="$durable_commit"; fi
              if [[ "$retention_run_id" =~ ^[1-9][0-9]*$ ]]; then
                gh run download "$retention_run_id" --name nemlig-production-release --dir "$RUNNER_TEMP/nemlig-production-release" >/dev/null 2>&1 || true
              fi
            fi
          fi
          worker_report="$RUNNER_TEMP/nemlig-worker-retention.json"
          worker_status=0
          worker_args=(--commit "$worker_commit")
          if [[ "${{ needs.release-gate.outputs.worker_retention }}" == "true" ]]; then worker_args+=(--resume); fi
          if [[ -d "$RUNNER_TEMP/nemlig-production-release" ]]; then
            mapfile -t worker_journals < <(find "$RUNNER_TEMP/nemlig-production-release" -type f -name latest.json -print)
            if [[ "${#worker_journals[@]}" -eq 1 ]]; then worker_args+=(--journal "${worker_journals[0]}"); fi
          fi
          pnpm --silent --filter nemlig-assistant exec tsx scripts/worker-version-retention.ts -- "${worker_args[@]}" > "$worker_report" || worker_status=$?
          if jq -e '.cleanupComplete == true' "$worker_report" >/dev/null 2>&1; then
            echo "### Worker version retention" >> "$GITHUB_STEP_SUMMARY"
            echo "- Policy: fixed UTC 48-hour cutoff" >> "$GITHUB_STEP_SUMMARY"
            echo "- Cleanup: complete" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Worker version retention" >> "$GITHUB_STEP_SUMMARY"
            echo "- Policy: fixed UTC 48-hour cutoff" >> "$GITHUB_STEP_SUMMARY"
            echo "- Cleanup: uncertain or incomplete; preserve the active/recovery references and reconcile before retrying" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$worker_status"
      - name: Upload Worker retention evidence
        if: ${{ always() && steps.worker_version_retention.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nemlig-worker-retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nemlig-worker-retention.json
          if-no-files-found: warn
          retention-days: 7
      - name: Report retention precondition failure
        if: ${{ always() && steps.retention_summary.outcome == 'skipped' }}
        run: |
          {
            echo "## Nemlig production release summary"
            echo "- Deployment: unknown (deployment evidence job did not complete)"
            echo "- Technical acceptance: unknown (not proven)"
            echo "- Owner acceptance: not run (CI synthetic acceptance is not owner proof)"
            echo "- Cleanup: uncertain (retention evidence step did not run)"
            echo "- Cleanup next action: hold cleanup and reconcile the exact prior operation and provider state before retrying."
            echo "- Traffic allocation: configured state is not measured by this summary; request rate is not inferred"
            echo "- Protected holds: unknown/invalid hold inventory"
          } >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    needs: release-gate
    if: needs.release-gate.outputs.reconcile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: nemlig-production
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout recovery candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ env.CANDIDATE_SHA }}"
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Reconcile exact pending rollback and release lease
        env:
          GH_TOKEN: "${{ github.token }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          RECONCILE_OPERATION: "${{ env.RECONCILE_OPERATION }}"
        run: |
          set -euo pipefail
          result=$(pnpm --silent --filter nemlig-assistant production:deploy -- reconcile-recovery "$RECONCILE_OPERATION" --evidence-saved --original-runner-stopped)
          node --input-type=module -e '
            const result = JSON.parse(process.argv[1]);
            if (result.reconciled !== true || result.state !== "disabled") process.exit(1);
          ' "$result"
          pnpm --filter nemlig-assistant production:deploy -- finalize "$RECONCILE_OPERATION" --evidence-saved --original-runner-stopped

  preflight:
    needs: release-gate
    if: needs.release-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ env.CANDIDATE_SHA }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Verify candidate SHA
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git rev-parse --verify "$CANDIDATE_SHA^{commit}" >/dev/null
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run credential-free source and environment preflight
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          if [[ "$RECOVERY" == "true" ]]; then
            pnpm --filter nemlig-assistant production:deploy -- preflight --recovery "$CANDIDATE_SHA"
          else
            pnpm --filter nemlig-assistant production:deploy -- preflight "$CANDIDATE_SHA"
          fi

  deploy:
    needs: [release-gate, preflight]
    if: needs.release-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: nemlig-production
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ env.CANDIDATE_SHA }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build candidate
        run: pnpm --filter nemlig-assistant build
      - name: Verify Cloudflare release access
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
        run: |
          pnpm --filter nemlig-assistant exec wrangler deployments list --env production --json >/dev/null
          pnpm --filter nemlig-assistant exec wrangler containers list --env production --json >/dev/null
      - name: Deploy exact approved merge
        id: deploy
        env:
          GH_TOKEN: "${{ github.token }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          NEMLIG_MCP_AUTH0_ISSUER: https://everyday-assistants.eu.auth0.com/
          NEMLIG_MCP_PUBLIC_URL: https://nemlig-mcp.broesby.dk/mcp
          NEMLIG_MCP_SERVICE_CLIENT_ID: "${{ vars.NEMLIG_MCP_SERVICE_CLIENT_ID }}"
          NEMLIG_MCP_SERVICE_CLIENT_SECRET: "${{ secrets.NEMLIG_MCP_SERVICE_CLIENT_SECRET }}"
          NEMLIG_CI_ACCEPTANCE_READY: "${{ vars.NEMLIG_CI_ACCEPTANCE_READY }}"
        run: |
          set -euo pipefail
          if [[ "$RECOVERY" == "true" ]]; then
            pnpm --silent --filter nemlig-assistant production:deploy -- --recovery "$CANDIDATE_SHA"
          else
            pnpm --silent --filter nemlig-assistant production:deploy -- --service "$CANDIDATE_SHA"
          fi >"$RUNNER_TEMP/nemlig-release.json"
      - name: Upload bounded release report and deployment journal
        id: release-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nemlig-production-release
          path: |
            ${{ runner.temp }}/nemlig-release.json
            .git/nemlig-production-deploy/latest.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: Finalize routine deployment recovery
        if: ${{ always() && steps.deploy.outcome == 'success' && steps.release-artifact.outcome == 'success' }}
        env:
          GH_TOKEN: "${{ github.token }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
        run: |
          set -euo pipefail
          operation_id=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const value = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (typeof value.operationId !== "string" || !/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/.test(value.operationId)) process.exit(1);
            process.stdout.write(value.operationId);
          ' "$GITHUB_WORKSPACE/.git/nemlig-production-deploy/latest.json")
          pnpm --filter nemlig-assistant production:deploy -- finalize "$operation_id" --evidence-saved --original-runner-stopped
