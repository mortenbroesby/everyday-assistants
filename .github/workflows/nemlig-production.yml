name: Nemlig production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      commit:
        description: Full green main ancestor SHA to deploy for recovery
        required: true
        type: string
      recovery:
        description: Confirm this is an incident recovery deployment
        required: true
        type: boolean
      resume_retention:
        description: Resume interrupted image cleanup without deploying
        required: false
        type: boolean
        default: false

concurrency:
  group: nemlig-production
  cancel-in-progress: false
  queue: max

permissions:
  # The protected deploy/finalize jobs create and delete the bounded recovery
  # ref. Jobs that do not need that capability keep their narrower permissions.
  contents: write

env:
  CANDIDATE_SHA: "${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.commit) || github.sha }}"
  RECOVERY: "${{ github.event_name == 'workflow_dispatch' && inputs.recovery || false }}"
  RESUME_RETENTION: "${{ github.event_name == 'workflow_dispatch' && inputs.resume_retention || false }}"

jobs:
  release-gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.recovery == true || inputs.resume_retention == true)) ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: "${{ steps.approval.outputs.deploy || steps.catch-up.outputs.deploy }}"
      retention: "${{ steps.approval.outputs.retention || 'false' }}"
      retention_commit: "${{ steps.approval.outputs.retention_commit }}"
    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ env.CANDIDATE_SHA }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Skip hourly reconciliation when this exact SHA already succeeded
        id: catch-up
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: "${{ github.token }}"
          CANDIDATE_SHA: "${{ env.CANDIDATE_SHA }}"
        run: |
          set -euo pipefail
          if ledger="$(gh api "repos/$GITHUB_REPOSITORY/contents/retention-ledger.json?ref=codex-retention/nemlig-production" --jq .content 2>"$RUNNER_TEMP/ledger-error")"; then
            ledger_json="$(printf '%s' "$ledger" | base64 --decode)"
            jq -e 'type == "object" and .schema == 1 and (.accepted | type == "array") and (.accepted | length > 0) and (.accepted[0].commit | type == "string")' <<<"$ledger_json" >/dev/null
            deployed_sha="$(jq -r '.accepted[0].commit' <<<"$ledger_json")"
          elif rg -q 'HTTP 404' "$RUNNER_TEMP/ledger-error"; then
            deployed_sha=""
          else
            cat "$RUNNER_TEMP/ledger-error" >&2
            exit 1
          fi
          if [[ "$deployed_sha" == "$CANDIDATE_SHA" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check exact main candidate
        if: steps.catch-up.outputs.deploy != 'false' || steps.catch-up.outputs.retention == 'true'
        id: approval
        env:
          CANDIDATE_SHA: "${{ env.CANDIDATE_SHA }}"
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$RECOVERY" == "true" && "$RESUME_RETENTION" == "true" ]]; then
            echo "Recovery deployment and retention resume are mutually exclusive." >&2
            exit 1
          fi
          git fetch origin refs/heads/main:refs/remotes/origin/main
          if [[ "$RECOVERY" == "true" || "$RESUME_RETENTION" == "true" ]]; then
            if ! git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main; then
              echo "Recovery/retention candidate must be an ancestor of current main." >&2
              exit 1
            fi
          elif [[ "$CANDIDATE_SHA" != "$(git rev-parse origin/main)" ]]; then
            echo "Routine candidate must equal current main." >&2
            exit 1
          fi
          if [[ "$RESUME_RETENTION" == "true" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "retention=true" >> "$GITHUB_OUTPUT"
            echo "retention_commit=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.catch-up.outputs.deploy }}" == "false" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "retention=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "retention=false" >> "$GITHUB_OUTPUT"
          fi

  retention:
    needs: [release-gate, preflight, deploy]
    if: >-
      always() &&
      (needs.deploy.result == 'success' || needs.release-gate.outputs.retention == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: nemlig-production
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout accepted main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ env.CANDIDATE_SHA }}"
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Download accepted deployment evidence
        if: needs.deploy.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: nemlig-production-release
          path: ${{ runner.temp }}/nemlig-production-release
      - name: Retain accepted production images
        env:
          GH_TOKEN: "${{ github.token }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          DEPLOY_RESULT: "${{ needs.deploy.result }}"
          CANDIDATE_SHA: "${{ env.CANDIDATE_SHA }}"
          NEMLIG_CONTAINER_IMAGE_RETENTION_COUNT: "${{ vars.NEMLIG_CONTAINER_IMAGE_RETENTION_COUNT || '50' }}"
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_RESULT" == "success" ]]; then
            mapfile -t journals < <(find "$RUNNER_TEMP/nemlig-production-release" -type f -name latest.json -print)
            [[ "${#journals[@]}" -eq 1 ]]
            pnpm --silent --filter nemlig-assistant production:retention -- accept "$CANDIDATE_SHA" "${journals[0]}"
          elif [[ "${{ needs.release-gate.outputs.retention }}" == "true" ]]; then
            pnpm --silent --filter nemlig-assistant production:retention -- resume "${{ needs.release-gate.outputs.retention_commit }}"
          else
            echo "Retention job was scheduled without accepted deployment or explicit resume." >&2
            exit 1
          fi

  preflight:
    needs: release-gate
    if: needs.release-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ env.CANDIDATE_SHA }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Verify candidate SHA
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git rev-parse --verify "$CANDIDATE_SHA^{commit}" >/dev/null
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run credential-free source and environment preflight
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          if [[ "$RECOVERY" == "true" ]]; then
            pnpm --filter nemlig-assistant production:deploy -- preflight --recovery "$CANDIDATE_SHA"
          else
            pnpm --filter nemlig-assistant production:deploy -- preflight "$CANDIDATE_SHA"
          fi

  deploy:
    needs: [release-gate, preflight]
    if: needs.release-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: nemlig-production
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ env.CANDIDATE_SHA }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build candidate
        run: pnpm --filter nemlig-assistant build
      - name: Verify Cloudflare release access
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
        run: |
          pnpm --filter nemlig-assistant exec wrangler deployments list --env production --json >/dev/null
          pnpm --filter nemlig-assistant exec wrangler containers list --env production --json >/dev/null
      - name: Deploy exact approved merge
        id: deploy
        env:
          GH_TOKEN: "${{ github.token }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          NEMLIG_MCP_AUTH0_ISSUER: https://everyday-assistants.eu.auth0.com/
          NEMLIG_MCP_PUBLIC_URL: https://nemlig-mcp.broesby.dk/mcp
          NEMLIG_MCP_SERVICE_CLIENT_ID: "${{ vars.NEMLIG_MCP_SERVICE_CLIENT_ID }}"
          NEMLIG_MCP_SERVICE_CLIENT_SECRET: "${{ secrets.NEMLIG_MCP_SERVICE_CLIENT_SECRET }}"
          NEMLIG_CI_ACCEPTANCE_READY: "${{ vars.NEMLIG_CI_ACCEPTANCE_READY }}"
        run: |
          set -euo pipefail
          if [[ "$RECOVERY" == "true" ]]; then
            pnpm --silent --filter nemlig-assistant production:deploy -- --recovery "$CANDIDATE_SHA"
          else
            pnpm --silent --filter nemlig-assistant production:deploy -- --service "$CANDIDATE_SHA"
          fi >"$RUNNER_TEMP/nemlig-release.json"
      - name: Upload bounded release report and deployment journal
        id: release-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nemlig-production-release
          path: |
            ${{ runner.temp }}/nemlig-release.json
            .git/nemlig-production-deploy/latest.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: Finalize routine deployment recovery
        if: ${{ always() && steps.deploy.outcome == 'success' && steps.release-artifact.outcome == 'success' }}
        env:
          GH_TOKEN: "${{ github.token }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
        run: |
          set -euo pipefail
          operation_id=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const value = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (typeof value.operationId !== "string" || !/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/.test(value.operationId)) process.exit(1);
            process.stdout.write(value.operationId);
          ' "$GITHUB_WORKSPACE/.git/nemlig-production-deploy/latest.json")
          pnpm --filter nemlig-assistant production:deploy -- finalize "$operation_id" --evidence-saved --original-runner-stopped
