name: Nemlig production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: nemlig-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  release-gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      deploy: ${{ steps.candidate.outputs.deploy }}
    steps:
      - name: Checkout current main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Validate exact successful CI candidate
        id: candidate
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          [[ "$CI_WORKFLOW" == "CI" ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin refs/heads/main:refs/remotes/origin/main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$CANDIDATE_SHA" != "$CURRENT_MAIN_SHA" ]]; then
            printf '%s\n' "Skipping superseded CI candidate: $CANDIDATE_SHA (current main: $CURRENT_MAIN_SHA)" >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          printf '%s\n' "Deploy candidate: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: release-gate
    if: needs.release-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    environment:
      name: nemlig-production
    steps:
      - name: Checkout exact approved main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm candidate remains in main
        env:
          CANDIDATE_SHA: ${{ needs.release-gate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          git checkout --detach "$CANDIDATE_SHA"
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.13.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build candidate
        run: pnpm --filter nemlig-assistant build
      - name: Verify Cloudflare release access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter nemlig-assistant exec wrangler deployments list --env production --json >/dev/null
          pnpm --filter nemlig-assistant exec wrangler containers list --env production --json >/dev/null
      - name: Deploy and verify exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEMLIG_MCP_AUTH0_ISSUER: https://everyday-assistants.eu.auth0.com/
          NEMLIG_MCP_PUBLIC_URL: https://nemlig-mcp.broesby.dk/mcp
          NEMLIG_MCP_SERVICE_CLIENT_ID: ${{ vars.NEMLIG_MCP_SERVICE_CLIENT_ID }}
          NEMLIG_MCP_SERVICE_CLIENT_SECRET: ${{ secrets.NEMLIG_MCP_SERVICE_CLIENT_SECRET }}
          NEMLIG_CI_ACCEPTANCE_READY: ${{ vars.NEMLIG_CI_ACCEPTANCE_READY }}
          CANDIDATE_SHA: ${{ needs.release-gate.outputs.candidate_sha }}
        run: pnpm --filter nemlig-assistant production:deploy -- --service "$CANDIDATE_SHA"
