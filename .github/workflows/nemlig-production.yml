name: Nemlig production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA from main to deploy
        required: true
        type: string
      cutover:
        description: Run the supervised service cutover path
        required: false
        default: false
        type: boolean
      finalize_operation:
        description: Finalize one accepted cutover operation instead of deploying
        required: false
        type: string

concurrency:
  group: nemlig-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CANDIDATE_SHA: "${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit }}"
  CUTOVER: "${{ github.event_name == 'workflow_run' && 'false' || inputs.cutover }}"

jobs:
  release-gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      deploy: "${{ steps.approval.outputs.deploy }}"
      publish: "${{ steps.approval.outputs.publish }}"
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ env.CANDIDATE_SHA }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check exact release eligibility
        id: approval
        env:
          EVENT_NAME: "${{ github.event_name }}"
          CANDIDATE_SHA: "${{ env.CANDIDATE_SHA }}"
          FINALIZE_OPERATION: "${{ inputs.finalize_operation }}"
        run: |
          set -euo pipefail
          if [[ -n "$FINALIZE_OPERATION" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CANDIDATE_PARENT=$(git rev-parse "$CANDIDATE_SHA^1")
          git fetch origin refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse origin/main)" == "$CANDIDATE_SHA" ]]
          policy=$(pnpm --silent --filter nemlig-assistant check:version-bump --base "$CANDIDATE_PARENT" --head "$CANDIDATE_SHA" --json)
          eligible=$(node --input-type=module -e '
            const policy = JSON.parse(process.argv[1]);
            if (policy.eligible === true) process.stdout.write("true");
            else if (policy.eligible === false) process.stdout.write("false");
            else throw new Error("Version policy did not return eligibility.");
          ' "$policy")
          if [[ "$eligible" == "true" ]]; then
            pnpm --filter nemlig-assistant check:release-note --base "$CANDIDATE_PARENT" --head "$CANDIDATE_SHA"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            if [[ "$CUTOVER" == "true" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    needs: release-gate
    if: needs.release-gate.outputs.deploy == 'true' && inputs.finalize_operation == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ env.CANDIDATE_SHA }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Verify candidate SHA
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git rev-parse --verify "$CANDIDATE_SHA^{commit}" >/dev/null
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run credential-free source and environment preflight
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          pnpm --filter nemlig-assistant production:deploy -- preflight "$CANDIDATE_SHA"

  deploy:
    needs: [release-gate, preflight]
    if: needs.release-gate.outputs.deploy == 'true' && inputs.finalize_operation == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: nemlig-production
    permissions:
      contents: write
      actions: read
    outputs:
      artifact-id: "${{ steps.release-artifact.outputs.artifact-id }}"
    steps:
      - name: Checkout validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ env.CANDIDATE_SHA }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build candidate
        run: pnpm --filter nemlig-assistant build
      - name: Verify Cloudflare release access
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
        run: |
          pnpm --filter nemlig-assistant exec wrangler deployments list --env production --json >/dev/null
          pnpm --filter nemlig-assistant exec wrangler containers list --env production --json >/dev/null
      - name: Deploy through protected release command
        env:
          GH_TOKEN: "${{ github.token }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          NEMLIG_MCP_AUTH0_ISSUER: https://everyday-assistants.eu.auth0.com/
          NEMLIG_MCP_PUBLIC_URL: https://nemlig-mcp.broesby.dk/mcp
          NEMLIG_MCP_SERVICE_CLIENT_ID: "${{ vars.NEMLIG_MCP_SERVICE_CLIENT_ID }}"
          NEMLIG_MCP_SERVICE_CLIENT_SECRET: "${{ secrets.NEMLIG_MCP_SERVICE_CLIENT_SECRET }}"
          NEMLIG_CI_ACCEPTANCE_READY: "${{ vars.NEMLIG_CI_ACCEPTANCE_READY }}"
        run: |
          set -euo pipefail
          if [[ "$CUTOVER" == "true" ]]; then
            pnpm --filter nemlig-assistant production:deploy -- --service-cutover "$CANDIDATE_SHA"
          else
            pnpm --filter nemlig-assistant production:deploy -- --service "$CANDIDATE_SHA"
          fi >"$RUNNER_TEMP/nemlig-release.json"
      - name: Upload bounded release report and deployment journal
        id: release-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nemlig-production-release
          path: |
            ${{ runner.temp }}/nemlig-release.json
            .git/nemlig-production-deploy/latest.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Finalize routine deployment recovery
        if: ${{ always() && steps.release-artifact.outcome == 'success' && env.CUTOVER != 'true' }}
        env:
          GH_TOKEN: "${{ github.token }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
        run: |
          set -euo pipefail
          operation_id=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const value = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (typeof value.operationId !== "string" || !/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/.test(value.operationId)) process.exit(1);
            process.stdout.write(value.operationId);
          ' "$GITHUB_WORKSPACE/.git/nemlig-production-deploy/latest.json")
          pnpm --filter nemlig-assistant production:deploy -- finalize "$operation_id" --evidence-saved --original-runner-stopped

  publish-release:
    needs: [release-gate, deploy]
    if: >-
      needs.release-gate.outputs.deploy == 'true' &&
      needs.release-gate.outputs.publish == 'true' &&
      inputs.finalize_operation == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact deployed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ env.CANDIDATE_SHA }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Download exact deployment journal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "${{ needs.deploy.outputs.artifact-id }}"
          path: "${{ runner.temp }}/nemlig-release-artifact"
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish verified deployment release
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          GITHUB_RUN_ID: "${{ github.run_id }}"
        run: |
          set -euo pipefail
          mapfile -t journals < <(find "$RUNNER_TEMP/nemlig-release-artifact" -type f -name nemlig-release.json -print)
          [[ "${#journals[@]}" -eq 1 ]]
          pnpm --filter nemlig-assistant publish:deployment-release -- \
            --journal "${journals[0]}" \
            --candidate "$CANDIDATE_SHA" \
            --repository "$GITHUB_REPOSITORY"

  finalize:
    needs: release-gate
    if: needs.release-gate.outputs.deploy == 'true' && inputs.finalize_operation != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: nemlig-production
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout accepted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Finalize accepted cutover recovery
        env:
          FINALIZE_OPERATION: "${{ inputs.finalize_operation }}"
          GH_TOKEN: "${{ github.token }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
        run: |
          set -euo pipefail
          pnpm --filter nemlig-assistant production:deploy -- finalize "$FINALIZE_OPERATION" --evidence-saved --original-runner-stopped
