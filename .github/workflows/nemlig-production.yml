name: Nemlig production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA from main to deploy
        required: true
        type: string
      cutover:
        description: Run the supervised service cutover path
        required: false
        default: false
        type: boolean

concurrency:
  group: nemlig-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CANDIDATE_SHA: "${{ inputs.commit }}"
  CUTOVER: "${{ inputs.cutover }}"

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Verify candidate SHA
        env:
          CANDIDATE_SHA: "${{ inputs.commit }}"
          GITHUB_SHA_VALUE: "${{ github.sha }}"
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA_VALUE" == "$CANDIDATE_SHA" ]]
          git rev-parse --verify "$CANDIDATE_SHA^{commit}" >/dev/null
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run credential-free source and environment preflight
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          pnpm --filter nemlig-assistant production:deploy -- preflight "$CANDIDATE_SHA"

  deploy:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: nemlig-production
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: "${{ env.CANDIDATE_SHA }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build candidate
        run: pnpm --filter nemlig-assistant build
      - name: Deploy through protected release command
        env:
          GH_TOKEN: "${{ github.token }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          NEMLIG_MCP_AUTH0_ISSUER: https://everyday-assistants.eu.auth0.com/
          NEMLIG_MCP_PUBLIC_URL: https://nemlig-mcp.broesby.dk/mcp
          NEMLIG_MCP_SERVICE_CLIENT_ID: "${{ vars.NEMLIG_MCP_SERVICE_CLIENT_ID }}"
          NEMLIG_MCP_SERVICE_CLIENT_SECRET: "${{ secrets.NEMLIG_MCP_SERVICE_CLIENT_SECRET }}"
          NEMLIG_CI_ACCEPTANCE_READY: "${{ vars.NEMLIG_CI_ACCEPTANCE_READY }}"
        run: |
          set -euo pipefail
          if [[ "$CUTOVER" == "true" ]]; then
            pnpm --filter nemlig-assistant production:deploy -- --service-cutover "$CANDIDATE_SHA"
          else
            pnpm --filter nemlig-assistant production:deploy -- --service "$CANDIDATE_SHA"
          fi >"$RUNNER_TEMP/nemlig-release.json"
      - name: Upload bounded release report and deployment journal
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: nemlig-production-release
          path: |
            ${{ runner.temp }}/nemlig-release.json
            .git/nemlig-production-deploy/latest.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
