name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  fallow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fallow changed-code report
        uses: fallow-rs/fallow@aaaec796f5449810b9ecf82ed7e62b775d4d1ef3 # v3.32.0
        with:
          command: audit
          version: 3.32.0
          fail-on-issues: false
          annotations: false

  verify:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Authenticate Docker Hub when configured
        if: ${{ vars.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Run Nemlig production readiness
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            log="${RUNNER_TEMP}/nemlig-production-ready-${attempt}.log"
            if pnpm nemlig:production:ready 2>&1 | tee "${log}"; then
              exit 0
            fi
            if ! grep -q 'registry-1.docker.io.*429 Too Many Requests' "${log}" || [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            echo "Docker Hub throttled the container dry run; retrying in $((attempt * 30)) seconds."
            sleep "$((attempt * 30))"
          done
      - run: pnpm check
      - name: Check Fallow dead-code regressions
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
          baseline="${RUNNER_TEMP}/fallow-dead-code-baseline.json"
          if git cat-file -e "origin/${base_ref}:.code-health/fallow-dead-code-baseline.json" 2>/dev/null; then
            git show "origin/${base_ref}:.code-health/fallow-dead-code-baseline.json" > "${baseline}"
          else
            if [[ "$(git merge-base HEAD "origin/${base_ref}")" != "$(git rev-parse "origin/${base_ref}")" ]] || ! git diff --quiet "origin/${base_ref}...HEAD" -- apps/nemlig-assistant; then
              echo "::error::The initial Fallow baseline requires current ${base_ref} and unchanged Nemlig app source."
              exit 1
            fi
            cp .code-health/fallow-dead-code-baseline.json "${baseline}"
          fi
          report="${RUNNER_TEMP}/fallow-dead-code.json"
          if pnpm exec fallow --workspace apps/nemlig-assistant dead-code --baseline "${baseline}" --format json --quiet > "${report}"; then
            echo "No new Fallow dead-code findings."
          else
            status=$?
            jq -r '
              . as $report
              | (.summary? | to_entries[]? | select(.value > 0 and .key != "total_issues") | "\(.key): \(.value)"),
                ($report.summary? | keys[]? as $category | $report[$category][]? | select(.path? != null) | "\($category): \(.path)")
            ' "${report}" || true
            exit "${status}"
          fi
      - run: pnpm test
      - run: pnpm --filter nemlig-assistant exec playwright install --with-deps chrome
      - run: pnpm --filter nemlig-assistant smoke:review-ui
