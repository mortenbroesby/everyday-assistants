name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nemlig:production:ready
      - run: pnpm check
      - run: node --test scripts/nemlig-code-health.test.mjs
      - name: Compare code-health baseline
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
          base_commit="$(git rev-parse "origin/${base_ref}")"
          if git cat-file -e "origin/${base_ref}:.code-health/nemlig-assistant-baseline.json" 2>/dev/null; then
            git show "origin/${base_ref}:.code-health/nemlig-assistant-baseline.json" > "${RUNNER_TEMP}/nemlig-assistant-baseline.json"
            pnpm code-health -- --baseline "${RUNNER_TEMP}/nemlig-assistant-baseline.json"
          else
            [[ "$(git merge-base HEAD "origin/${base_ref}")" == "${base_commit}" ]]
            git diff --quiet "origin/${base_ref}...HEAD" -- apps/nemlig-assistant
            [[ "$(jq -r '.generatedFrom' .code-health/nemlig-assistant-baseline.json)" == "${base_commit}" ]]
            pnpm code-health
          fi
      - run: pnpm test
      - run: pnpm --filter nemlig-assistant exec playwright install --with-deps chrome
      - run: pnpm --filter nemlig-assistant smoke:review-ui
