name: Nemlig private staging

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Reviewed commit SHA from this repository to exercise
        required: true
        type: string

permissions:
  actions: read
  pull-requests: read
  contents: read

concurrency:
  group: nemlig-private-staging
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: nemlig-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the exact reviewed candidate
        env:
          CANDIDATE: ${{ inputs.candidate }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          if ! git merge-base --is-ancestor "$CANDIDATE" origin/main; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE/pulls" \
              --jq ".[] | select(.state == \"open\" and .base.ref == \"main\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\" and .head.sha == \"$CANDIDATE\") | .number" | head -1)
            [[ -n "$pr" ]]
            [[ "$(gh pr view "$pr" --json reviewDecision --jq .reviewDecision)" == APPROVED ]]
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews" --paginate --jq ".[] | select(.state == \"APPROVED\" and .commit_id == \"$CANDIDATE\") | .id" | tail -1)" =~ ^[0-9]+$ ]]
          fi
          [[ "$(gh run list --workflow ci.yml --commit "$CANDIDATE" --limit 1 --json conclusion --jq '.[0].conclusion')" == success ]]
          git checkout --detach "$CANDIDATE"
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE" ]]
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter nemlig-assistant build
      - name: Deploy and run the synthetic shopper
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_AUTH0_ISSUER: ${{ vars.STAGING_AUTH0_ISSUER }}
          STAGING_AUTH0_CLIENT_ID: ${{ vars.STAGING_AUTH0_CLIENT_ID }}
          STAGING_AUTH0_CLIENT_SECRET: ${{ secrets.STAGING_AUTH0_CLIENT_SECRET }}
          STAGING_PRINCIPALS: ${{ secrets.STAGING_PRINCIPALS }}
          STAGING_CREDENTIAL_KEY: ${{ secrets.STAGING_CREDENTIAL_KEY }}
        run: pnpm --filter nemlig-assistant staging:deploy
