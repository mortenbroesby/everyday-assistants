name: UI benchmark (opt-in)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  product-viewer:
    if: github.event.label.name == 'benchmark:ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter nemlig-assistant exec playwright install --with-deps chrome
      - run: pnpm --filter nemlig-assistant bench:review-ui -- --runs 5
