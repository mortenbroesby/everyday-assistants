<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your draft list</title>
<style>
:root { color-scheme: light dark; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --line: #e7eae5; --accent: #426744; --soft: #f1f5ee; --muted: #6b736b; }
* { box-sizing: border-box; }
body { margin: 0; padding: 12px; background: #fff; color: #252c25; }
main { max-width: 560px; margin: auto; }
h1 { font-size: 1.15rem; font-weight: 650; text-align: center; letter-spacing: -.025em; margin: 8px 0 5px; } h2 { font-size: .8rem; font-weight: 600; margin: 18px 0 7px; color: var(--muted); }
p { margin: 6px 0; } .muted { color: var(--muted); font-size: .8rem; }
#intro { text-align: center; max-width: 35ch; margin: 0 auto 14px; }
button, input { font: inherit; } button, summary { cursor: pointer; }
button { min-height: 44px; padding: 8px 12px; color: inherit; background: var(--soft); border: 1px solid transparent; border-radius: 9px; font-size: .86rem; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: white; }
button[aria-current="page"] { background: var(--accent); color: white; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 3px solid #4b94dd; outline-offset: 2px; }
nav, .actions, form { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
nav { margin-bottom: 10px; padding: 4px; background: var(--soft); border-radius: 12px; } nav button { flex: 1; background: transparent; }
nav button::after { content: attr(data-hint); display: block; font-size: .72rem; font-weight: 400; }
.actions { margin-top: 10px; } .actions > button { flex: 1; }
#status { margin: 6px 0; font-size: .8rem; color: var(--muted); } #status:empty { display: none; } #fallback { white-space: pre-wrap; overflow-wrap: anywhere; }
article { border-bottom: 1px solid var(--line); padding: 9px 0; display: flex; align-items: flex-start; gap: 3px; }
article > details { flex: 1; min-width: 0; } article > label { display: flex; min-width: 44px; min-height: 54px; align-items: center; justify-content: center; }
input[type="checkbox"], input[type="radio"] { width: 17px; height: 17px; accent-color: var(--accent); }
summary.row { list-style: none; display: grid; grid-template-columns: 44px minmax(0, 1fr) 12px; gap: 8px; min-height: 54px; align-items: center; }
summary.row::-webkit-details-marker { display: none; }
summary.row::after { content: "⌄"; font-size: 1rem; color: var(--muted); }
details[open] > summary.row::after { content: "⌃"; }
.photo { width: 44px; height: 48px; object-fit: contain; font-size: .6rem; display: grid; place-items: center; background: var(--soft); border-radius: 6px; text-align: center; color: var(--muted); }
.headline { display: flex; justify-content: space-between; gap: 8px; } .name { font-weight: 550; overflow-wrap: anywhere; } .price { white-space: nowrap; font-size: .85rem; font-variant-numeric: tabular-nums; }
.meta { font-size: .75rem; color: var(--muted); overflow-wrap: anywhere; } .badge { font-size: .67rem; color: var(--accent); background: var(--soft); border-radius: 4px; padding: 1px 4px; margin-right: 4px; }
.basket-quantity { font-size: .8rem; font-weight: 600; color: var(--accent); }
.detail-body { padding: 12px 0 4px; overflow-wrap: anywhere; } .fact { border-top: 1px solid var(--line); padding: 8px 0; } .fact > summary { min-height: 44px; display: flex; align-items: center; }
.quantity-control { display: flex; align-items: center; gap: 12px; } .quantity-control button { min-width: 44px; }
.quiet { background: transparent; color: var(--muted); }
.empty-state { text-align: center; padding: 28px 4px; } .empty-state .icon { font-size: 2rem; }
.empty-state button { display: block; width: 100%; margin-top: 8px; }
.summary-line { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
input[type="search"] { min-width: 0; flex: 1; width: 100%; } input[type="search"], input[type="number"] { min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; color: inherit; background: transparent; }
input[type="number"] { width: 76px; } form { margin: 10px 0; } form label { width: 100%; }
footer { padding-top: 12px; margin-top: 4px; } footer > button { width: 100%; margin-top: 6px; }
footer > button.quiet { background: transparent; color: var(--muted); font-size: .78rem; }
#submission { background: var(--soft); border-radius: 12px; padding: 14px; margin-top: 12px; }
#context > article { background: var(--soft); border: 0; padding: 8px; border-radius: 10px; }
@media (prefers-color-scheme: dark) { :root { --line: #394238; --accent: #52794f; --soft: #252e25; --muted: #acb6aa; } body { background: #191e19; color: #f1f4ee; } .badge { color: #bdd7b5; } }
[hidden] { display: none !important; }
</style>
</head>
<body><main aria-labelledby="title">
<nav id="navigation" aria-label="Draft list destinations" hidden></nav>
<h1 id="title" tabindex="-1">Your draft list</h1>
<p id="intro" class="muted">Inspect products here or continue in conversation.</p>
<p id="status" role="status" aria-live="polite">Loading your draft list…</p>
<div id="context"></div>
<section id="products" aria-label="Product results"></section>
<footer id="actions" hidden></footer>
<section id="submission" aria-label="Exact Nemlig submission confirmation" hidden></section>
<p id="fallback" class="muted" hidden></p>
</main><script>
(() => {
  "use strict";
  const root = document.getElementById("products"), nav = document.getElementById("navigation"), context = document.getElementById("context");
  const status = document.getElementById("status"), title = document.getElementById("title"), intro = document.getElementById("intro");
  const footer = document.getElementById("actions"), submissionRoot = document.getElementById("submission"), fallback = document.getElementById("fallback");
  const safeImageOrigins = new Set(["https://nemlig.com", "https://www.nemlig.com"]);
  const quantityQuietMs = 400;
  let review, active = false, unavailable = false, busy = false, selected = new Set(), replacement, expanded = new Set(), factsExpanded = new Set();
  let quantityTimer, quantityFlush;
  const pendingQuantities = new Map();
  let showAfterSuccess = false;
  let confirmingClear = false, confirmingSubmit = false, submitBlocked = false;
  let bridgeReady = false, received = false, requestId = 0;
  const pending = new Map();
  const notify = (method, params) => window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
  const rpc = (method, params) => new Promise((resolve, reject) => {
    const id = "nemlig-" + ++requestId;
    const timer = setTimeout(() => { pending.delete(id); reject(new Error("The host has not confirmed the action. Refresh before trying again.")); }, 20000);
    pending.set(id, { resolve, reject, timer });
    window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
  });
  const callTool = async (name, args) => {
    let timer;
    try {
      return await Promise.race([
        bridgeReady ? rpc("tools/call", { name, arguments: args }) : window.openai.callTool(name, args),
        new Promise((_, reject) => { timer = setTimeout(() => reject(new Error("The host has not confirmed the update.")), 20000); })
      ]);
    } finally { clearTimeout(timer); }
  };
  const text = (value, empty = "Unknown") => typeof value === "string" && value.trim() ? value : empty;
  const money = value => typeof value === "number" && Number.isFinite(value) ? value.toFixed(2) + " kr" : "Unknown price";
  const el = (tag, value, className) => { const node = document.createElement(tag); if (value !== undefined) node.textContent = value; if (className) node.className = className; return node; };
  const safeImageUrl = value => { try { const url = new URL(value); return url.protocol === "https:" && safeImageOrigins.has(url.origin) ? url.href : undefined; } catch { return undefined; } };
  const canUse = view => view && view.status === "complete" && view.product.available === true;
  const nameOf = item => item.view.status === "complete" ? text(item.view.product.name) : "Product " + item.product_id;
  const button = (label, action, primary = false) => { const node = el("button", label, primary ? "primary" : ""); node.type = "button"; node.disabled = busy; node.addEventListener("click", action); return node; };
  const explain = message => { fallback.hidden = false; fallback.textContent = message; };
  const followUp = async (prompt, guidance = "Continue in conversation to inspect the exact submission. Nothing has been sent to Nemlig.") => {
    if (bridgeReady) {
      try { await rpc("ui/message", { role: "user", content: [{ type: "text", text: prompt }] }); return; } catch { /* Show conversational fallback. */ }
    }
    if (window.openai && typeof window.openai.sendFollowUpMessage === "function") {
      try { await window.openai.sendFollowUpMessage({ prompt }); return; } catch { /* Keep the exact request available if the host fails. */ }
    }
    explain(guidance);
  };
  const updateNow = async action => {
    if (!review || busy) return;
    const restarting = action.kind === "restart";
    const tool = restarting ? "start_product_review" : "update_product_review";
    const args = restarting ? { items: review.items.map(({ product_id, quantity }) => ({ product_id, quantity })) }
      : action.kind === "show" ? { action }
      : { review_id: review.review_id, revision: review.revision, action };
    if (!bridgeReady && (!window.openai || typeof window.openai.callTool !== "function")) {
      const descriptions = {
        restart: "start a new local draft list of these products", show: "refresh your local draft list", end: "discard this temporary local draft list", revisit: "move selected products back to To decide", accept: "accept the selected products into Ready",
        remove: "remove the selected products locally", quantity: "change this product's local quantity",
        alternatives: "find alternatives for this product", replace: "use the selected alternative",
        navigate: "open " + (action.destination === "ready" ? "Ready" : action.destination === "alternatives" ? "the current alternatives" : "To decide"),
        prepare_submission: "prepare Ready products before submitting them to Nemlig"
      };
      await followUp("Please use " + tool + " with " + JSON.stringify(args) + ". This changes only the local draft list, not the real Nemlig basket.",
        "Continue in conversation: ask to " + descriptions[action.kind] + ". No change has been confirmed here.");
      return false;
    }
    busy = true;
    let applied = false;
    document.querySelectorAll("button").forEach(node => { node.disabled = true; });
    status.textContent = "Updating…";
    try {
      const result = await callTool(tool, args);
      if (result && result.isError) throw new Error((result.content || []).filter(c => c.type === "text").map(c => c.text).join(" ") || "Update failed.");
      if (!receive(result, true)) throw new Error("No updated draft list was returned. Refresh before trying again.");
      applied = true;
      if (action.kind === "prepare_submission" && review?.submission?.status === "prepared") {
        confirmingSubmit = true; renderSubmission();
      }
      if (review && window.openai && typeof window.openai.setWidgetState === "function") {
        window.openai.setWidgetState({ review_id: review.review_id, revision: review.revision, destination: review.destination });
      }
    } catch (error) {
      const message = error && error.message ? error.message : "Update failed.";
      active = false; selected = new Set(); replacement = undefined; confirmingClear = false; confirmingSubmit = false;
      if (/Draft list unavailable|No active draft list|revision is stale/i.test(message)) {
        // Read only: recover the active conversation, never replay the failed edit.
        try {
          const current = await callTool("update_product_review", { action: { kind: "show" } });
          if (!receive(current, true)) throw new Error("Could not refresh the local draft list.");
          status.textContent = unavailable ? "" : "Loaded the current draft list. Your last action was not applied; choose again.";
        } catch {
          status.textContent = "We could not load the current draft list. Open the current draft list again when the connection is available.";
        }
      } else status.textContent = "We could not confirm this action. Open the current draft list to check its state before trying again.";
    } finally {
      busy = false;
      if (action.kind === "quantity") {
        pendingQuantities.delete(action.product_id);
        if (!applied) pendingQuantities.clear();
      }
      // Preserve disabled states by rendering the last confirmed snapshot.
      const message = status.textContent;
      renderReview();
      status.textContent = message;
    }
    return applied;
  };
  const displayQuantity = item => pendingQuantities.has(item.product_id) ? pendingQuantities.get(item.product_id) : item.quantity;
  const queueQuantity = (productId, quantity) => {
    pendingQuantities.set(productId, quantity);
    renderReview();
    status.textContent = "Quantity updated. Saving after a short pause.";
    clearTimeout(quantityTimer);
    quantityTimer = setTimeout(() => { quantityTimer = undefined; void flushQuantities(); }, quantityQuietMs);
  };
  const flushQuantities = async () => {
    clearTimeout(quantityTimer); quantityTimer = undefined;
    if (quantityFlush) return quantityFlush;
    const entries = [...pendingQuantities].filter(([id, quantity]) => review?.items.some(item => item.product_id === id && item.quantity !== quantity));
    if (!entries.length) { pendingQuantities.clear(); renderReview(); return true; }
    quantityFlush = (async () => {
      for (const [productId, quantity] of entries) {
        if (!await updateNow({ kind: "quantity", product_id: productId, quantity })) {
          pendingQuantities.clear(); renderReview(); return false;
        }
      }
      return true;
    })();
    try { return await quantityFlush; }
    finally { quantityFlush = undefined; }
  };
  const update = async action => {
    if (action.kind === "quantity") { queueQuantity(action.product_id, action.quantity); return true; }
    if (!await flushQuantities()) {
      status.textContent = "The quantity change was not saved, so this action was not applied. Check the current draft list before continuing.";
      return false;
    }
    return updateNow(action);
  };
  const submitPrepared = async () => {
    if (!active || submitBlocked || !confirmingSubmit) return;
    if (!await flushQuantities()) {
      status.textContent = "The quantity change was not saved, so nothing was sent to Nemlig. Check the current draft list.";
      return;
    }
    const submission = review && review.submission;
    if (!active || busy || !confirmingSubmit || !submission || submission.status !== "prepared") {
      if (!submission && review) { renderReview(); status.textContent = "The Ready quantities changed. Prepare the exact Nemlig basket change again before sending."; }
      return;
    }
    const args = { review_id: review.review_id, revision: review.revision, submission_id: submission.submission_id };
    busy = true; submitBlocked = true; confirmingSubmit = false;
    document.querySelectorAll("button").forEach(node => { node.disabled = true; });
    status.textContent = "Updating Nemlig basket…";
    try {
      const result = await callTool("submit_product_review", args);
      if (result && result.isError) throw new Error("Submission was not confirmed.");
      if (!receive(result, true)) throw new Error("Submission result was not confirmed.");
      status.textContent = "";
    } catch {
      // A provider write may already have happened. Never retry it or restore the confirm button.
      try {
        const current = await callTool("update_product_review", { action: { kind: "show" } });
        receive(current, true);
      } catch { /* Keep the last known review but block submission. */ }
      status.textContent = "Submission could not be confirmed. Inspect the actual Nemlig basket in conversation; do not retry automatically.";
    } finally {
      busy = false;
      const message = status.textContent;
      renderReview(); status.textContent = message;
    }
  };
  const detailsFact = (body, label, value, key) => {
    if (!value) return;
    const details = el("details", undefined, "fact"); details.open = factsExpanded.has(key);
    details.addEventListener("toggle", () => { if (details.open) factsExpanded.add(key); else factsExpanded.delete(key); });
    details.append(el("summary", label), value); body.append(details);
  };
  const row = (view, item, mode) => {
    const article = el("article");
    const product = view && view.status === "complete" ? view.product : {};
    const id = item ? item.product_id : product.id;
    if (mode === "select" || mode === "alternative") {
      const label = el("label"), input = el("input");
      input.type = mode === "select" ? "checkbox" : "radio";
      input.name = mode === "select" ? "accepted" : "replacement";
      input.setAttribute("aria-label", (mode === "select" ? "Select " : "Choose ") + text(product.name, "product " + id));
      input.disabled = !canUse(view) || busy;
      input.checked = mode === "select" ? selected.has(id) : replacement === id;
      input.addEventListener("change", () => {
        if (mode === "select") { if (input.checked) selected.add(id); else selected.delete(id); }
        else replacement = id;
        renderFooter();
      });
      label.append(input); article.append(label);
    }
    const details = el("details"), summary = el("summary", undefined, "row");
    const disclosureKey = mode + ":" + id;
    details.open = expanded.has(disclosureKey);
    details.addEventListener("toggle", () => { if (details.open) expanded.add(disclosureKey); else expanded.delete(disclosureKey); });
    const imageUrl = safeImageUrl(product.image_url);
    if (imageUrl) {
      const image = el("img", undefined, "photo"); image.src = imageUrl; image.alt = text(product.name, "Product image");
      image.addEventListener("error", () => image.replaceWith(el("span", "No image", "photo")), { once: true }); summary.append(image);
    } else summary.append(el("span", "No image", "photo"));
    const info = el("div"), headline = el("div", undefined, "headline");
    const quantity = item ? displayQuantity(item) : view && view.context === "basket" ? view.basket && view.basket.quantity : undefined;
    headline.append(el("span", text(product.name, "Product " + (id || "details unavailable")), "name"), el("span", money(quantity !== undefined && typeof product.price === "number" ? quantity * product.price : product.price), "price"));
    info.append(headline, el("div", [product.brand, product.unit_size].filter(Boolean).join(" · ") || "Package details unavailable", "meta"));
    info.append(el("div", product.unit_price === undefined ? text(product.unit, "Unit price unavailable") : money(product.unit_price) + (product.unit ? " · " + product.unit : ""), "meta"));
    if (quantity !== undefined) info.append(el("div", quantity + " ×", "basket-quantity"));
    if (mode !== "ready") for (const [label, value] of [["Organic", product.is_organic], ["Frozen", product.is_frozen], ["Offer", product.is_on_discount]]) if (value === true) info.append(el("span", label, "badge"));
    if (product.available !== true) info.append(el("div", product.available === undefined ? "Availability unknown" : "Unavailable", "meta"));
    summary.append(info); details.append(summary);
    const body = el("div", undefined, "detail-body");
    if (!view || view.status !== "complete") body.append(el("p", "Product details unavailable."));
    else {
      body.append(el("p", "Product ID: " + product.id, "muted"));
      detailsFact(body, "Varebeskrivelse", typeof product.description === "string" && product.description.trim() ? el("p", product.description) : undefined, id + ":description");
      detailsFact(body, "Varedeklaration", typeof product.declaration === "string" && product.declaration.trim() ? el("p", product.declaration) : undefined, id + ":declaration");
      if (Array.isArray(product.details) && product.details.length) {
        const facts = el("div");
        for (const detail of product.details) if (detail && detail.key && detail.value) facts.append(el("p", detail.key + ": " + detail.value));
        detailsFact(body, "Detaljer om varen", facts, id + ":details");
      }
      if (view.context === "basket" || view.context === "review") {
        const quantities = view.context === "basket" ? view.basket : view.review;
        const lineQuantity = item ? displayQuantity(item) : quantities && quantities.quantity;
        const lineTotal = item && typeof product.price === "number" ? lineQuantity * product.price : quantities && quantities.line_total;
        body.append(el("p", (view.context === "basket" ? "Nemlig basket quantity: " : "Draft list quantity: ") + (lineQuantity || "Unknown") + " · Line total: " + money(lineTotal)));
      }
    }
    if (item && mode !== "alternative") {
      const quantityControl = el("div", undefined, "quantity-control");
      const quantity = displayQuantity(item);
      const decrement = button("−", () => void update({ kind: "quantity", product_id: id, quantity: quantity - 1 }));
      decrement.setAttribute("aria-label", "Decrease quantity of " + nameOf(item)); decrement.disabled = busy || quantity <= 1;
      const increment = button("+", () => void update({ kind: "quantity", product_id: id, quantity: quantity + 1 }));
      increment.setAttribute("aria-label", "Increase quantity of " + nameOf(item)); increment.disabled = busy || quantity >= Number.MAX_SAFE_INTEGER;
      quantityControl.append(el("span", "Quantity"), decrement, el("span", String(quantity)), increment);
      body.append(quantityControl);
      const actions = el("div", undefined, "actions");
      if (item.state === "needs-review") actions.append(button("Choose alternative", () => {
        if (review.alternatives && review.alternatives.product_id === id) void update({ kind: "navigate", destination: "alternatives" });
        else void update({ kind: "alternatives", product_id: id, query: text(product.subcategory, text(product.name, String(id))).slice(0, 200) });
      }));
      actions.append(button("Remove", () => void update({ kind: "remove", product_ids: [id] })));
      if (item.state === "ready") actions.append(button("Move to To decide", () => void update({ kind: "revisit", product_ids: [id] })));
      body.append(actions);
    }
    details.append(body); article.append(details); return article;
  };
  const renderFooter = () => {
    footer.replaceChildren(); footer.hidden = !review; if (!review) return;
    if (review.destination === "needs-review") {
      const available = review.items.filter(i => i.state === "needs-review" && canUse(i.view));
      if (available.length > 1) footer.append(button(selected.size === available.length ? "Clear selected" : "Select all", () => {
        selected = selected.size === available.length ? new Set() : new Set(available.map(i => i.product_id)); renderReview();
      }));
      if (selected.size) {
        footer.append(el("p", selected.size + " selected", "muted"));
        footer.append(button("Add " + selected.size + " to Ready", () => void update({ kind: "accept", product_ids: [...selected] }), true));
      }
    } else if (review.destination === "ready") {
      const items = review.items.filter(i => i.state === "ready");
      const known = items.every(i => i.view.status === "complete" && typeof i.view.product.price === "number");
      const summary = el("p", undefined, "summary-line"); summary.append(el("span", items.length + (items.length === 1 ? " product ready" : " products ready")), el("span", known ? money(items.reduce((sum, i) => sum + displayQuantity(i) * i.view.product.price, 0)) : "Unavailable")); footer.append(summary);
      const pendingCount = review.items.length - items.length;
      if (pendingCount) footer.append(el("p", pendingCount + (pendingCount === 1 ? " product still needs a decision" : " products still need decisions") + " and will not be submitted.", "muted"));
      const prepare = button("Send to Nemlig basket", () => void update({ kind: "prepare_submission" }), true);
      prepare.disabled = busy || !items.length || !!(review.submission && review.submission.status !== "prepared");
      footer.append(prepare);
      if (items.length) {
        const clear = button("Remove all Ready products", () => { confirmingClear = true; renderFooter(); });
        clear.className = "quiet"; footer.append(clear);
        if (confirmingClear) footer.append(el("p", "Remove " + items.length + " Ready products from this draft list? Your real Nemlig basket will not change."),
          button("Remove Ready products", () => void update({ kind: "remove", product_ids: items.map(i => i.product_id) })),
          button("Cancel", () => { confirmingClear = false; renderFooter(); }));
      }
    } else if (review.alternatives) {
      const target = review.items.find(i => i.product_id === review.alternatives.product_id);
      const replace = button("Use selected alternative", () => void update({ kind: "replace", product_id: target.product_id, replacement_id: replacement }), true);
      replace.disabled = busy || replacement === undefined; footer.append(replace);
      footer.append(button("Back to To decide", () => void update({ kind: "navigate", destination: "needs-review" })));
    }
    const refresh = button("Refresh draft list", () => void update({ kind: "show" })); refresh.className = "quiet";
    const finish = button("Clear draft list and start over", () => {
      footer.replaceChildren(el("p", "Discard this entire local draft list? Your real Nemlig basket will not change."),
        button("Discard draft list", () => void update({ kind: "end" })), button("Keep shopping", renderFooter));
    }); finish.className = "quiet";
    footer.append(refresh, finish);
  };
  const renderSubmission = () => {
    submissionRoot.replaceChildren(); submissionRoot.hidden = !review.submission; if (!review.submission) return;
    const submission = review.submission;
    submissionRoot.append(el("h2", submission.status === "submitted" ? "Added to Nemlig — verified" : submission.status === "uncertain" ? "Check Nemlig before trying again" : "Confirm the exact Nemlig change"));
    const lines = Array.isArray(submission.review.lines) ? submission.review.lines : [];
    for (const line of lines) submissionRoot.append(el("p", line.quantity + " × " + text(line.name, "Product " + line.product_id) + " · " + text(line.unit_size, "") + " · " + money(line.item_price) + " each · " + money(line.line_total)));
    submissionRoot.append(el("p", "Expected Nemlig product total: " + money(submission.review.expected_products_price)));
    if (submission.status === "prepared") {
      submissionRoot.append(el("p", "These quantities replace the quantities of the same products in Nemlig. Other products stay unchanged.", "muted"));

      else if (confirmingSubmit) {
        submissionRoot.append(el("p", "Add " + (lines.length === 1 ? "this product" : "these " + lines.length + " products") + " to your real Nemlig basket for " + money(submission.review.expected_products_price) + "? Only the shown product quantities will be set."));
        submissionRoot.append(button("Cancel", () => { confirmingSubmit = false; renderSubmission(); }), button("Add to Nemlig", () => void submitPrepared(), true));
      } else submissionRoot.append(button("Review exact change", () => { confirmingSubmit = true; renderSubmission(); }, true));
      submissionRoot.append(button("Inspect in conversation", () => void followUp("Please present the exact prepared Nemlig basket change for draft list " + review.review_id + ", revision " + review.revision + ", submission " + submission.submission_id + ", and ask for my explicit approval. Do not submit yet.")));
    } else submissionRoot.append(el("p", submission.status === "submitted" ? "Nemlig readback verified. Your draft list remains available, but this exact submission cannot be repeated." : "The submission outcome is uncertain. Inspect the actual Nemlig basket; do not retry automatically."));
  };
  const renderEmpty = () => {
    nav.hidden = true; context.replaceChildren(); root.replaceChildren(); submissionRoot.hidden = true; footer.hidden = true;
    title.textContent = "What should we shop for?";
    intro.textContent = "Ask Nemlig Assistant what you need. We’ll find products and bring them here for you to decide.";
    const panel = el("div", undefined, "empty-state"); panel.append(el("div", "🛒", "icon"));
    for (const [label, prompt] of [
      ["Plan groceries for the week", "Help me plan groceries for the week and find exact Nemlig products for my draft list."],
      ["Find ingredients for dinner", "Help me find ingredients for dinner and bring exact Nemlig products into my draft list."],
      ["Find products from my shopping list", "Help me find products from my shopping list and start a new Nemlig draft list."],
    ]) panel.append(button(label, () => void followUp(prompt, "Ask Nemlig Assistant in conversation: " + label + ".")));
    root.append(panel);
  };
  const renderReview = () => {
    if (!review) { if (received && active) renderEmpty(); return; }
    if (!active) {
      nav.hidden = true; context.replaceChildren(); root.replaceChildren(); submissionRoot.hidden = true;
      title.textContent = "Your draft list";
      intro.textContent = "Open the current draft list to continue shopping.";
      footer.hidden = false;
      footer.replaceChildren(button("Open current draft list", () => void update({ kind: "show" }), true));
      return;
    }
    if (unavailable) {
      nav.hidden = true; context.replaceChildren(); root.replaceChildren(); submissionRoot.hidden = true;
      title.textContent = "Start a new draft list";
      intro.textContent = "This temporary draft list is no longer available. Refresh can find this conversation’s current draft list.";
      footer.hidden = false;
      footer.replaceChildren(button("Refresh draft list", () => void update({ kind: "show" })));
      if (review.submission && ["submitted", "uncertain"].includes(review.submission.status)) {
        root.append(el("p", "Check your actual Nemlig basket in conversation before starting again. A previous submission may have changed it."));
      } else if (review.items.length) {
        root.append(el("p", "Start again with these products and quantities. You will need to choose them again; previous draft lists and submission approval will not be restored."));
        footer.append(button("Start new draft list", () => void update({ kind: "restart" }), true));
      }
      return;
    }
    if (!review.items.length) { renderEmpty(); status.textContent = ""; return; }
    if (review.submission?.status === "submitted" && !showAfterSuccess) {
      nav.hidden = true; context.replaceChildren(); root.replaceChildren(); footer.hidden = true;
      title.textContent = "Added to Nemlig";
      intro.textContent = "Your exact submission was verified against the real Nemlig basket.";
      renderSubmission(); submissionRoot.hidden = false;
      root.append(button("Continue with draft list", () => { showAfterSuccess = true; renderReview(); }));
      return;
    }
    nav.hidden = false; nav.replaceChildren(); context.replaceChildren(); root.replaceChildren();
    for (const [destination, label, hint] of [["needs-review", "To decide", "decide"], ["ready", "Ready", "ready"]]) {
      const control = button(label + " (" + review.items.filter(i => i.state === destination).length + ")", () => void update({ kind: "navigate", destination }));
      control.setAttribute("data-hint", hint);
      if (review.destination === destination) control.setAttribute("aria-current", "page"); nav.append(control);

    if (review.destination === "alternatives" && review.alternatives) {

      title.textContent = "Choose alternative for " + nameOf(target);
      context.append(button("‹ Back to To decide", () => void update({ kind: "navigate", destination: "needs-review" })), el("h2", "Current product"), row(target.view, undefined, "current"), el("h2", "Alternatives"));
      const form = el("form"), label = el("label", "Search for more products"), query = el("input");
      query.id = "alternative-query"; label.htmlFor = query.id; query.type = "search"; query.required = true; query.maxLength = 200; query.value = alternatives.query;
      const search = button("Search products", () => {}); search.type = "submit"; form.append(label, query, search);

      if (!alternatives.views.length) root.append(el("p", "No new alternatives for this draft list. Search for another product or go back to To decide."));

      title.textContent = review.destination === "ready" ? "Ready" : "To decide";
      if (review.destination === "needs-review" && review.alternatives) context.append(button("Return to alternatives for " + nameOf(review.items.find(i => i.product_id === review.alternatives.product_id)), () => void update({ kind: "navigate", destination: "alternatives" })));

      items.forEach(item => root.append(row(item.view, item, item.state === "needs-review" ? "select" : "ready")));
      if (!items.length) {
        root.append(el("p", review.destination === "ready" ? "No products are Ready yet. Choose exact products in To decide." : "Everything in this draft list is Ready."));
        root.append(button(review.destination === "ready" ? "Go to To decide" : "Go to Ready", () => void update({ kind: "navigate", destination: review.destination === "ready" ? "needs-review" : "ready" }), true));
      }
    }
    status.textContent = "";
    renderFooter(); renderSubmission();
  };
  const receive = (payload, current = false) => {
    if (payload && payload.isError) {
      received = true;
      active = false; selected = new Set(); replacement = undefined; renderReview();
      status.textContent = "Could not load the draft list. Reconnect Nemlig or try again in conversation.";
      return false;
    }
    const value = payload && payload.structuredContent || payload;
    if (!value || typeof value !== "object") return false;
    if (value.unavailable === true) {
      received = true; active = current || active; unavailable = true; selected = new Set(); replacement = undefined; expanded = new Set(); confirmingClear = false; confirmingSubmit = false;
      status.textContent = "";
      if (review) renderReview();
      else {
        nav.hidden = true; footer.hidden = true; submissionRoot.hidden = true;
        context.replaceChildren(); root.replaceChildren();
        active = true; renderEmpty();
      }
      return true;
    }
    if (value.ended) {
      received = true; active = true; unavailable = false; review = undefined; selected = new Set(); expanded = new Set(); factsExpanded = new Set(); confirmingClear = false; confirmingSubmit = false;
      renderEmpty(); status.textContent = "Your local draft list was discarded. Nothing changed in Nemlig."; return true;
    }
    if (value.review && Array.isArray(value.review.items) && value.review.review_id) {
      const sameReview = review && review.review_id === value.review.review_id;
      if (!current && active && review && !sameReview) return true;
      if (sameReview && value.review.revision < review.revision) return !current;
      const verifiedCompletion = sameReview && review.submission?.status === "uncertain"
        && value.review.submission?.status === "submitted"
        && value.review.submission.submission_id === review.submission.submission_id;
      if (!current && sameReview && value.review.revision === review.revision && !verifiedCompletion) return true;
      const previousSubmissionId = review && review.submission && review.submission.submission_id;
      received = true; active = current || (active && sameReview); unavailable = false; review = value.review;
      selected = sameReview ? new Set([...selected].filter(id => review.items.some(i => i.product_id === id && i.state === "needs-review"))) : new Set();
      if (!sameReview) { expanded = new Set(); factsExpanded = new Set(); showAfterSuccess = false; }
      if (review.submission?.status === "submitted" && (!sameReview || previousSubmissionId !== review.submission.submission_id)) showAfterSuccess = false;
      replacement = sameReview && review.alternatives && review.alternatives.views.some(v => v.status === "complete" && v.product.id === replacement) ? replacement : undefined;
      confirmingClear = false; confirmingSubmit = false;
      if (!sameReview || review.submission?.submission_id !== previousSubmissionId) submitBlocked = false;
      fallback.hidden = true; renderReview(); return true;
    }
    const views = Array.isArray(value.views) ? value.views : Array.isArray(value.products) ? value.products : Array.isArray(value.result) ? value.result : Array.isArray(value) ? value : undefined;
    if (!views) return false;
    if (!current && active && review) return true;
    received = true; active = false; unavailable = false; review = undefined; nav.hidden = true; footer.hidden = true; submissionRoot.hidden = true; context.replaceChildren(); root.replaceChildren();
    const actualBasket = value.detail_limit !== undefined && Array.isArray(value.items);
    title.textContent = actualBasket ? "Actual Nemlig basket" : "Nemlig products";
    intro.textContent = actualBasket ? "Your current Nemlig basket. This view cannot change it." : "Inspect product details here or continue in conversation.";
    views.forEach(view => root.append(row(view, undefined, "result")));
    status.textContent = actualBasket ? views.length + " basket lines shown" + (value.unenriched_count ? "; " + value.unenriched_count + " without current details" : "") + "." : views.length + " products shown.";
    if (actualBasket && !views.length) root.append(el("p", "Your Nemlig basket is empty."));

    rpc("ui/initialize", { protocolVersion: "2026-01-26", appInfo: { name: "nemlig-product-review", version: "1.0.0" }, appCapabilities: {} }).then(result => {

  }
  setTimeout(() => { if (!received) status.textContent = "Products have not arrived. Ask to show your current draft list, or reconnect Nemlig if needed."; }, 25000);
})();
